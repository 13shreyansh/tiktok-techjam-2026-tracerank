<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TraceRank autonomous recommendation research system</title>
  <desc id="desc">An evidence-gated experiment loop improves an organizer baseline, then packages a six-model user-rank ensemble only after chronological, slice, seed, and convergence checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #a9b7cf; }
      .white { fill: #f8fafc; }
      .blue { fill: #93c5fd; }
      .green { fill: #6ee7b7; }
      .amber { fill: #fcd34d; }
      .small { font-size: 22px; }
      .body { font-size: 25px; }
      .label { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-size: 30px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="80" r="260" fill="#2563eb" opacity="0.08"/>
  <circle cx="135" cy="845" r="260" fill="#10b981" opacity="0.06"/>

  <g class="sans">
    <text x="80" y="78" class="white" font-size="48" font-weight="800">TraceRank</text>
    <text x="80" y="116" class="muted" font-size="25">Autonomous recommendation research with evidence before promotion</text>
    <rect x="1275" y="54" width="245" height="48" rx="24" fill="#172554" stroke="#3b82f6"/>
    <text x="1398" y="86" text-anchor="middle" class="blue label">TRACK 2</text>

    <g filter="url(#shadow)">
      <rect x="80" y="170" width="270" height="220" rx="26" fill="#151e33" stroke="#334155" stroke-width="2"/>
      <text x="110" y="210" class="blue label">FIXED START</text>
      <text x="110" y="258" class="white card-title">Organizer FM</text>
      <text x="110" y="301" class="muted body">Data loader</text>
      <text x="110" y="337" class="muted body">Evaluator</text>
      <text x="110" y="373" class="muted body">0.601600 baseline</text>
    </g>

    <path d="M 350 280 C 395 280, 398 280, 438 280" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <g filter="url(#shadow)">
      <rect x="440" y="152" width="670" height="326" rx="30" fill="#121d34" stroke="#3b82f6" stroke-width="2"/>
      <text x="480" y="198" class="blue label">AUTONOMOUS LOOP</text>

      <g>
        <rect x="480" y="230" width="170" height="84" rx="18" fill="#1e3a5f"/>
        <text x="565" y="265" text-anchor="middle" class="white body" font-weight="700">Hypothesis</text>
        <text x="565" y="293" text-anchor="middle" class="muted small">declare first</text>

        <rect x="690" y="230" width="170" height="84" rx="18" fill="#1e3a5f"/>
        <text x="775" y="265" text-anchor="middle" class="white body" font-weight="700">Bounded run</text>
        <text x="775" y="293" text-anchor="middle" class="muted small">code + train</text>

        <rect x="900" y="230" width="170" height="84" rx="18" fill="#1e3a5f"/>
        <text x="985" y="265" text-anchor="middle" class="white body" font-weight="700">Evaluate</text>
        <text x="985" y="293" text-anchor="middle" class="muted small">fixed metrics</text>

        <path d="M 650 272 L 681 272" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)"/>
        <path d="M 860 272 L 891 272" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)"/>
      </g>

      <g>
        <rect x="480" y="347" width="258" height="90" rx="18" fill="#0f2f32" stroke="#10b981"/>
        <text x="609" y="382" text-anchor="middle" class="green body" font-weight="750">Robustness gates</text>
        <text x="609" y="413" text-anchor="middle" class="muted small">time • users • seeds</text>

        <rect x="772" y="347" width="298" height="90" rx="18" fill="#2e2630" stroke="#f59e0b"/>
        <text x="921" y="382" text-anchor="middle" class="amber body" font-weight="750">Keep or reject</text>
        <text x="921" y="413" text-anchor="middle" class="muted small">ledger + reflection</text>

        <path d="M 738 392 L 763 392" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
        <path d="M 921 347 C 921 325, 775 325, 775 320" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
      </g>
    </g>

    <path d="M 1110 280 C 1153 280, 1153 280, 1192 280" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <g filter="url(#shadow)">
      <rect x="1195" y="170" width="325" height="220" rx="26" fill="#102b2d" stroke="#10b981" stroke-width="2"/>
      <text x="1227" y="210" class="green label">PROTECTED RESULT</text>
      <text x="1227" y="258" class="white card-title">0.605375</text>
      <text x="1227" y="298" class="muted body">GAUC 0.672521</text>
      <text x="1227" y="334" class="muted body">nDCG@5 0.538228</text>
      <text x="1227" y="370" class="green small">format checked • frozen</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="80" y="535" width="1440" height="210" rx="30" fill="#111b2f" stroke="#334155" stroke-width="2"/>
      <text x="120" y="580" class="blue label">SELECTED MODEL</text>

      <g>
        <rect x="120" y="610" width="300" height="92" rx="18" fill="#18243c"/>
        <text x="270" y="646" text-anchor="middle" class="white body" font-weight="700">Candidate context</text>
        <text x="270" y="678" text-anchor="middle" class="muted small">user • video • tag • tab</text>

        <rect x="465" y="610" width="310" height="92" rx="18" fill="#18243c"/>
        <text x="620" y="646" text-anchor="middle" class="white body" font-weight="700">Recent positive history</text>
        <text x="620" y="678" text-anchor="middle" class="muted small">last 20 videos + tags</text>

        <path d="M 420 656 L 456 656" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="820" y="610" width="245" height="92" rx="18" fill="#172554" stroke="#3b82f6"/>
        <text x="942" y="646" text-anchor="middle" class="white body" font-weight="700">6 neural FMs</text>
        <text x="942" y="678" text-anchor="middle" class="muted small">3 seeds × 2 histories</text>

        <path d="M 775 656 L 811 656" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="1110" y="610" width="360" height="92" rx="18" fill="#0f2f32" stroke="#10b981"/>
        <text x="1290" y="646" text-anchor="middle" class="green body" font-weight="750">Within-user rank mean</text>
        <text x="1290" y="678" text-anchor="middle" class="muted small">variance-reduced consensus</text>

        <path d="M 1065 656 L 1101 656" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
      </g>
    </g>

    <g>
      <rect x="80" y="790" width="1440" height="62" rx="20" fill="#0b1326" stroke="#273449"/>
      <text x="115" y="828" class="muted small">
        <tspan class="green" font-weight="700">SAFEGUARDS</tspan>
        <tspan dx="24">train + validation only</tspan>
        <tspan dx="42">50 attempts / 6 h per run</tspan>
        <tspan dx="42">ε = 0.002, N = 3</tspan>
        <tspan dx="42">commands • hashes • time • memory</tspan>
      </text>
    </g>
  </g>
</svg>
